<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D Parkour</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  canvas { display:block; }

  /* Mobile controls */
  .controls {
    position:fixed;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
  }
  .btn {
    width:80px;
    height:80px;
    margin:10px;
    background:#ffffff22;
    border-radius:50%;
    pointer-events:auto;
    touch-action:none;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
  <div>
    <div class="btn" id="left"></div>
    <div class="btn" id="right"></div>
  </div>
  <div class="btn" id="jump"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyA3jiEM6zhgB_pG5FBwNToRacCHg-icxEQ",
  authDomain: "test-a39a0.firebaseapp.com",
  databaseURL: "https://test-a39a0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "test-a39a0",
  storageBucket: "test-a39a0.firebasestorage.app",
  messagingSenderId: "60373406658",
  appId: "1:60373406658:web:943c58016734135c33fc5b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* Canvas */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* Player */
const player = {
  x: 100,
  y: 100,
  w: 30,
  h: 30,
  vx: 0,
  vy: 0,
  onGround: false
};

const spawn = { x:100, y:100 };

/* Platforms */
const platforms = [
  {x:0, y:canvas.height-40, w:canvas.width, h:40},
  {x:200, y:canvas.height-120, w:150, h:20},
  {x:400, y:canvas.height-200, w:150, h:20},
  {x:650, y:canvas.height-300, w:150, h:20}
];

/* Controls */
let keys = { left:false, right:false, jump:false };

document.getElementById("left").ontouchstart = () => keys.left = true;
document.getElementById("left").ontouchend = () => keys.left = false;

document.getElementById("right").ontouchstart = () => keys.right = true;
document.getElementById("right").ontouchend = () => keys.right = false;

document.getElementById("jump").ontouchstart = () => keys.jump = true;
document.getElementById("jump").ontouchend = () => keys.jump = false;

/* Keyboard */
onkeydown = e => {
  if(e.key==="a") keys.left=true;
  if(e.key==="d") keys.right=true;
  if(e.key==="w") keys.jump=true;
};
onkeyup = e => {
  if(e.key==="a") keys.left=false;
  if(e.key==="d") keys.right=false;
  if(e.key==="w") keys.jump=false;
};

/* Multiplayer */
const id = Math.random().toString(36).substring(2);
const playersRef = ref(db, "players/" + id);

let others = {};

onValue(ref(db, "players"), snap => {
  others = snap.val() || {};
});

/* Physics */
function update() {
  player.vx = 0;

  if(keys.left) player.vx = -4;
  if(keys.right) player.vx = 4;

  if(keys.jump && player.onGround) {
    player.vy = -10;
    player.onGround = false;
  }

  player.vy += 0.5; // gravity

  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;

  /* Collision */
  for(const p of platforms) {
    if(player.x < p.x+p.w &&
       player.x+player.w > p.x &&
       player.y < p.y+p.h &&
       player.y+player.h > p.y) {

      // landing
      if(player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  /* Death (fall) */
  if(player.y > canvas.height + 200) {
    player.x = spawn.x;
    player.y = spawn.y;
    player.vy = 0;
  }

  /* Sync multiplayer */
  set(playersRef, {
    x: player.x,
    y: player.y
  });
}

/* Draw */
function draw() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // platforms
  ctx.fillStyle = "white";
  for(const p of platforms) {
    ctx.fillRect(p.x,p.y,p.w,p.h);
  }

  // self
  ctx.fillStyle = "lime";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // others
  ctx.fillStyle = "red";
  for(const key in others) {
    if(key !== id) {
      const o = others[key];
      ctx.fillRect(o.x, o.y, 30, 30);
    }
  }
}

/* Game loop */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
