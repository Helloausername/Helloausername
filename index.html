  </style>

<body>

  <h2>💬 Live Chat</h2>

  <input id="username" placeholder="Enter your name..." />
  <input id="adminKey" placeholder="Admin key (optional)" />

  <div id="messages"></div>

<input id="msg" placeholder="Type a message..." 
      onkeydown="if(event.key==='Enter') send()" /> <button onclick="send()">Send</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, remove } 
      from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3jiEM6zhgB_pG5FBwNToRacCHg-icxEQ",
      authDomain: "test-a39a0.firebaseapp.com",
      databaseURL: "https://test-a39a0-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "test-a39a0",
      storageBucket: "test-a39a0.firebasestorage.app",
      messagingSenderId: "60373406658",
      appId: "1:60373406658:web:943c58016734135c33fc5b"
    };

    const ADMIN_KEY = "J8F7Ev3r66"; // CHANGE THIS

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    // Listen for new messages
    onChildAdded(messagesRef, (snapshot) => {
      const { name, text } = snapshot.val();
      const key = snapshot.key;

      const div = document.createElement('div');
      div.className = 'msg';

      const adminInput = document.getElementById("adminKey").value;

      let deleteBtn = "";
      if (adminInput === ADMIN_KEY) {
        deleteBtn = `<button class="deleteBtn" onclick="delMsg('${key}')">❌</button>`;
      }

      div.innerHTML = `
        <div>
          <span class="name">${name}:</span> ${text}
        </div>
        ${deleteBtn}
      `;

      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = 9999;
    });

    // Send message
    window.send = () => {
      const input = document.getElementById('msg');
      const username = document.getElementById('username').value || "Anonymous";

      if (!input.value.trim()) return;

      push(messagesRef, {
        name: username,
        text: input.value.trim()
      });

      input.value = '';
    };

    // Delete message
    window.delMsg = (id) => {
      const adminInput = document.getElementById("adminKey").value;

      if (adminInput !== ADMIN_KEY) {
        alert("Not authorized");
        return;
      }

      remove(ref(db, 'messages/' + id));
    };
  </script>

</body>
</html>
